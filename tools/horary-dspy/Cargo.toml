[package]
name = "horary-dspy"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
dsrust = { path = "vendor/dsrust" }
horary-ai-core = { path = "../../crates/horary-ai-core" }
horary-prompt-program = { path = "../../crates/horary-prompt-program" }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util"] }

[dev-dependencies]
tempfile = "3"

[workspace]
exclude = ["vendor/dsrust"]
