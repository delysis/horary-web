[package]
name = "horary-gepa"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
publish = false

[dependencies]
dsrust-gepa = { git = "https://github.com/getlatentic/dsrust", rev = "f24adde08c1d8850e4d7079d019643bb40f905cb" }
clap = { version = "4.6", features = ["derive"] }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros"] }
horary-prompt-program = { path = "../../crates/horary-prompt-program" }
horary-loop = { path = "../horary-loop" }

[dev-dependencies]
tempfile = "3"

[workspace]
