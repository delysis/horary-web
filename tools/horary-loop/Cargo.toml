[package]
name = "horary-loop"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
horary-prompt-program = { path = "../../crates/horary-prompt-program" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[workspace]
