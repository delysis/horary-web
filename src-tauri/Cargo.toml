[package]
name = "whorary"
version = "0.1.0"
description = "Whorary desktop shell"
authors = ["Whorary contributors"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
native-llama = ["dep:llama-cpp-2", "llama-cpp-2/common", "llama-cpp-2/sampler"]
native-llama-metal = ["native-llama", "llama-cpp-2/metal"]
native-llama-cuda = ["native-llama", "llama-cpp-2/cuda"]
native-llama-vulkan = ["native-llama", "llama-cpp-2/vulkan"]
native-llama-dynamic-backends = ["native-llama", "llama-cpp-2/dynamic-backends"]

[lib]
name = "whorary_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
llama-cpp-2 = { version = "0.1.150", default-features = false, optional = true }

[patch.crates-io]
llama-cpp-2 = { path = "../vendor/llama-cpp-2" }
llama-cpp-sys-2 = { path = "../vendor/llama-cpp-sys-2" }
