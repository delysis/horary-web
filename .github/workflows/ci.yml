name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit
      - run: npm run test:coverage

  tauri:
    name: Tauri (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      TAURI_ENV_PLATFORM: ${{ matrix.tauriPlatform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            tauriPlatform: darwin
          - os: windows-latest
            tauriPlatform: windows
          - os: ubuntu-latest
            tauriPlatform: linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget
      - run: npm ci
      - run: npm run check:tauri
      - name: Verify Tauri frontend asset mode
        run: npm run build
      - name: Build debug desktop binary
        run: npm run tauri -- build --debug --no-bundle
