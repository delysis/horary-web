name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-pack --version 0.13.1 --locked
      - run: npm ci
      - run: npm run check
      - run: npm audit
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: horary-web-review
          path: dist

  tauri:
    name: Tauri (${{ matrix.os }})
    # Fork PRs cannot receive the private native dependency's read-only key.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      TAURI_ENV_PLATFORM: ${{ matrix.tauriPlatform }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            tauriPlatform: darwin
            features: native-llama-metal
          - os: windows-latest
            tauriPlatform: windows
            features: native-llama
          - os: ubuntu-latest
            tauriPlatform: linux
            features: native-llama
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authenticate the private native-platform dependency
        shell: bash
        env:
          NATIVE_PLATFORM_KEY: ${{ secrets.NATIVE_PLATFORM_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "$NATIVE_PLATFORM_KEY"
          umask 077
          printf '%s\n' "$NATIVE_PLATFORM_KEY" > "$RUNNER_TEMP/native-platform-key"
          curl -fsSL https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > "$RUNNER_TEMP/github-known-hosts"
          test -s "$RUNNER_TEMP/github-known-hosts"
          git config --global url.'ssh://git@github.com/delysis/native-platform'.insteadOf 'https://github.com/delysis/native-platform'
          printf "GIT_SSH_COMMAND=ssh -i '%s/native-platform-key' -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='%s/github-known-hosts'\n" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Allow the native dependency's Windows paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-pack --version 0.13.1 --locked
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget
      - run: npm ci
      - run: npm run check:tauri
      - name: Verify Tauri frontend asset mode
        run: npm run build
      - name: Verify native backend compilation
        run: cargo test --manifest-path src-tauri/Cargo.toml --features ${{ matrix.features }}
      - name: Build macOS review app
        if: runner.os == 'macOS'
        run: npm run tauri -- build --debug --features native-llama-metal --bundles app
      - name: Archive macOS review app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent src-tauri/target/debug/bundle/macos/Horary.app Horary-macOS-review.zip
      - name: Build Windows or Linux review binary
        if: runner.os != 'macOS'
        run: npm run tauri -- build --debug --no-bundle --features native-llama
      - uses: actions/upload-artifact@v4
        with:
          name: horary-desktop-review-${{ runner.os }}
          path: |
            Horary-macOS-review.zip
            src-tauri/target/debug/horary.exe
            src-tauri/target/debug/horary
          if-no-files-found: error
      - name: Remove private dependency key
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/native-platform-key"
